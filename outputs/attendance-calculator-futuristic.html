<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futuristic Attendance Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080f;
      --panel: #10141f;
      --panel-2: #151b2a;
      --line: #2a354c;
      --text: #edf4ff;
      --muted: #9aa8bf;
      --cyan: #00d4ff;
      --green: #00f5a0;
      --red: #ff4d6d;
      --amber: #ffd166;
      --violet: #9d4edd;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(0, 212, 255, 0.12), transparent 30%),
        linear-gradient(315deg, rgba(157, 78, 221, 0.12), transparent 34%),
        linear-gradient(180deg, #07080f, #0c111d 48%, #07080f);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(1120px, 100%);
      display: grid;
      gap: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 4.9rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .clock {
      color: var(--muted);
      font-weight: 800;
      text-align: right;
      min-width: 180px;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
    }

    .panel {
      background: rgba(16, 20, 31, 0.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .inputs {
      padding: clamp(18px, 3vw, 28px);
      display: grid;
      gap: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #080c16;
      color: var(--text);
      padding: 16px;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.14);
    }

    .slider-row {
      display: grid;
      gap: 10px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.86rem;
    }

    input[type="range"] {
      accent-color: var(--cyan);
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-height: 128px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      display: grid;
      align-content: space-between;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .metric strong {
      font-size: clamp(1.9rem, 4vw, 3.1rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .green {
      color: var(--green);
    }

    .red {
      color: var(--red);
    }

    .cyan {
      color: var(--cyan);
    }

    .amber {
      color: var(--amber);
    }

    .visual {
      padding: 22px;
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .ring {
      --percent: 0;
      width: min(260px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #10141f 0 58%, transparent 59%),
        conic-gradient(var(--green) calc(var(--percent) * 1%), var(--red) 0);
      border: 1px solid var(--line);
      box-shadow:
        0 0 30px rgba(0, 245, 160, 0.12),
        inset 0 0 24px rgba(0, 212, 255, 0.08);
    }

    .ring-inner {
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px solid var(--line);
      background: #080c16;
    }

    .ring-inner strong {
      display: block;
      font-size: 3rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .ring-inner span {
      color: var(--muted);
      font-weight: 800;
      font-size: 0.82rem;
      text-transform: uppercase;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 16px;
    }

    .status strong {
      display: block;
      font-size: 1.35rem;
      margin-bottom: 7px;
    }

    .status p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .bars {
      display: grid;
      gap: 12px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.86rem;
    }

    .track {
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: #080c16;
      border: 1px solid var(--line);
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      transition: width 0.25s ease;
    }

    .fill.absent-fill {
      background: linear-gradient(90deg, var(--red), var(--amber));
    }

    @media (max-width: 920px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .visual {
        grid-template-columns: minmax(180px, 280px) 1fr;
        align-items: center;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 16px;
      }

      .topbar {
        display: grid;
        align-items: start;
      }

      .clock {
        text-align: left;
      }

      .grid,
      .results,
      .visual {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">Attendance Calculator</p>
        <h1>Future Count</h1>
      </div>
      <div class="clock" id="clock">--</div>
    </header>

    <section class="shell" aria-label="Attendance calculator">
      <div class="panel inputs">
        <div class="grid">
          <label>
            Total Classes
            <input id="total" type="number" min="0" value="40">
          </label>
          <label>
            Classes Attended
            <input id="attended" type="number" min="0" value="30">
          </label>
          <label>
            Target %
            <input id="target" type="number" min="1" max="100" value="75">
          </label>
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <span>Target calibration</span>
            <span id="targetReadout">75%</span>
          </div>
          <input id="targetSlider" type="range" min="1" max="100" value="75">
        </div>

        <div class="results">
          <div class="metric">
            <span>Attendance</span>
            <strong class="green" id="percentage">0%</strong>
          </div>
          <div class="metric">
            <span>Absent</span>
            <strong class="red" id="absent">0</strong>
          </div>
          <div class="metric">
            <span>Need</span>
            <strong class="cyan" id="needed">0</strong>
          </div>
          <div class="metric">
            <span>Can Miss</span>
            <strong class="amber" id="missable">0</strong>
          </div>
        </div>

        <div class="status">
          <strong id="statusTitle">Ready</strong>
          <p id="statusCopy">Enter your class numbers to calculate attendance instantly.</p>
        </div>
      </div>

      <aside class="panel visual">
        <div class="ring" id="ring">
          <div class="ring-inner">
            <div>
              <strong id="ringPercent">0%</strong>
              <span>current</span>
            </div>
          </div>
        </div>

        <div class="bars">
          <div>
            <div class="bar-label">
              <span>Present</span>
              <span id="presentBarText">0%</span>
            </div>
            <div class="track">
              <div class="fill" id="presentBar"></div>
            </div>
          </div>

          <div>
            <div class="bar-label">
              <span>Absent</span>
              <span id="absentBarText">0%</span>
            </div>
            <div class="track">
              <div class="fill absent-fill" id="absentBar"></div>
            </div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const totalInput = document.getElementById("total");
    const attendedInput = document.getElementById("attended");
    const targetInput = document.getElementById("target");
    const targetSlider = document.getElementById("targetSlider");
    const targetReadout = document.getElementById("targetReadout");

    const percentageEl = document.getElementById("percentage");
    const absentEl = document.getElementById("absent");
    const neededEl = document.getElementById("needed");
    const missableEl = document.getElementById("missable");
    const statusTitle = document.getElementById("statusTitle");
    const statusCopy = document.getElementById("statusCopy");
    const ring = document.getElementById("ring");
    const ringPercent = document.getElementById("ringPercent");
    const presentBar = document.getElementById("presentBar");
    const absentBar = document.getElementById("absentBar");
    const presentBarText = document.getElementById("presentBarText");
    const absentBarText = document.getElementById("absentBarText");
    const clock = document.getElementById("clock");

    function numberValue(input) {
      const value = Number(input.value);
      return Number.isFinite(value) ? value : 0;
    }

    function percent(attended, total) {
      if (total <= 0) return 0;
      return (attended / total) * 100;
    }

    function classesNeeded(attended, total, target) {
      let needed = 0;
      while (percent(attended + needed, total + needed) < target && needed < 10000) {
        needed += 1;
      }
      return needed;
    }

    function classesCanMiss(attended, total, target) {
      let missed = 0;
      while (percent(attended, total + missed + 1) >= target && missed < 10000) {
        missed += 1;
      }
      return missed;
    }

    function clampInputs() {
      let total = Math.max(0, Math.floor(numberValue(totalInput)));
      let attended = Math.max(0, Math.floor(numberValue(attendedInput)));
      let target = Math.min(100, Math.max(1, numberValue(targetInput)));

      if (attended > total) {
        attended = total;
        attendedInput.value = attended;
      }

      totalInput.value = total;
      targetInput.value = target;
      targetSlider.value = target;
      return { total, attended, target };
    }

    function update() {
      const { total, attended, target } = clampInputs();
      const absent = Math.max(0, total - attended);
      const current = percent(attended, total);
      const absentPercent = total > 0 ? 100 - current : 0;
      const needed = current >= target ? 0 : classesNeeded(attended, total, target);
      const missable = current >= target ? classesCanMiss(attended, total, target) : 0;

      percentageEl.textContent = `${current.toFixed(1)}%`;
      absentEl.textContent = absent;
      neededEl.textContent = needed;
      missableEl.textContent = missable;
      ringPercent.textContent = `${Math.round(current)}%`;
      targetReadout.textContent = `${target}%`;

      ring.style.setProperty("--percent", Math.max(0, Math.min(100, current)));
      presentBar.style.width = `${Math.max(0, Math.min(100, current))}%`;
      absentBar.style.width = `${Math.max(0, Math.min(100, absentPercent))}%`;
      presentBarText.textContent = `${current.toFixed(1)}%`;
      absentBarText.textContent = `${absentPercent.toFixed(1)}%`;

      if (total === 0) {
        statusTitle.textContent = "Awaiting data";
        statusTitle.className = "cyan";
        statusCopy.textContent = "Enter total classes and attended classes to begin.";
      } else if (current >= target) {
        statusTitle.textContent = "Target secured";
        statusTitle.className = "green";
        statusCopy.textContent = `You are at ${current.toFixed(1)}%. You can miss ${missable} class(es) and still stay at or above ${target}%.`;
      } else {
        statusTitle.textContent = "Target below line";
        statusTitle.className = "red";
        statusCopy.textContent = `You need to attend ${needed} more class(es) in a row to reach ${target}%.`;
      }
    }

    function updateClock() {
      clock.textContent = new Intl.DateTimeFormat("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(new Date());
    }

    [totalInput, attendedInput, targetInput, targetSlider].forEach((input) => {
      input.addEventListener("input", () => {
        if (input === targetSlider) targetInput.value = targetSlider.value;
        if (input === targetInput) targetSlider.value = targetInput.value;
        update();
      });
    });

    update();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
