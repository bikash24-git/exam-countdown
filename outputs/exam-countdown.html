<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Countdown</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5b6475;
      --paper: #f7f4ee;
      --panel: #ffffff;
      --line: #d8d1c4;
      --accent: #1d6f67;
      --accent-2: #b2432f;
      --shadow: 0 18px 45px rgba(23, 32, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(29, 111, 103, 0.12), transparent 36%),
        linear-gradient(315deg, rgba(178, 67, 47, 0.10), transparent 38%),
        var(--paper);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(980px, 100%);
    }

    .shell {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(216, 209, 196, 0.86);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      padding: clamp(24px, 4vw, 42px);
      border-bottom: 1px solid var(--line);
    }

    .label {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 4.6rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .target {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      margin-top: 16px;
      line-height: 1.55;
    }

    .status {
      min-width: 190px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf7;
      text-align: right;
      color: var(--muted);
      line-height: 1.35;
    }

    .status strong {
      display: block;
      color: var(--accent-2);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .unit {
      min-height: 190px;
      padding: clamp(18px, 3vw, 30px);
      display: grid;
      align-content: center;
      gap: 10px;
      border-right: 1px solid var(--line);
    }

    .unit:last-child {
      border-right: 0;
    }

    .value {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3rem, 9vw, 6.4rem);
      font-weight: 850;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .name {
      color: var(--muted);
      font-size: clamp(0.88rem, 1.6vw, 1rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px clamp(20px, 4vw, 32px);
      color: var(--muted);
      line-height: 1.45;
    }

    .progress {
      width: min(320px, 42%);
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: #e7e1d7;
      flex: none;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.35s ease;
    }

    @media (max-width: 760px) {
      body {
        padding: 16px;
      }

      .header {
        grid-template-columns: 1fr;
      }

      .status {
        text-align: left;
      }

      .timer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .unit {
        min-height: 150px;
      }

      .unit:nth-child(2) {
        border-right: 0;
      }

      .unit:nth-child(-n + 2) {
        border-bottom: 1px solid var(--line);
      }

      .footer {
        display: grid;
      }

      .progress {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-label="Exam countdown">
      <div class="header">
        <div>
          <p class="label">Exam Countdown</p>
          <h1>Stay Ready</h1>
          <div class="target">Target: <strong>15 July 2026, 10:30 AM IST</strong></div>
        </div>
        <div class="status" aria-live="polite">
          <strong id="status-title">Counting down</strong>
          <span id="status-copy">Time remaining until the exam begins.</span>
        </div>
      </div>

      <div class="timer" role="timer" aria-live="polite">
        <div class="unit">
          <div class="value" id="days">0</div>
          <div class="name">Days</div>
        </div>
        <div class="unit">
          <div class="value" id="hours">00</div>
          <div class="name">Hours</div>
        </div>
        <div class="unit">
          <div class="value" id="minutes">00</div>
          <div class="name">Minutes</div>
        </div>
        <div class="unit">
          <div class="value" id="seconds">00</div>
          <div class="name">Seconds</div>
        </div>
      </div>

      <div class="footer">
        <span id="today-copy">Using India Standard Time for the exam target.</span>
        <div class="progress" aria-hidden="true">
          <div class="bar" id="progress-bar"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const target = new Date("2026-07-15T10:30:00+05:30").getTime();
    const start = new Date("2026-06-03T00:00:00+05:30").getTime();

    const ids = ["days", "hours", "minutes", "seconds"];
    const elements = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]));
    const statusTitle = document.getElementById("status-title");
    const statusCopy = document.getElementById("status-copy");
    const todayCopy = document.getElementById("today-copy");
    const progressBar = document.getElementById("progress-bar");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const now = Date.now();
      const remaining = target - now;
      const totalWindow = target - start;
      const elapsed = Math.max(0, now - start);
      const percent = totalWindow > 0 ? Math.min(100, (elapsed / totalWindow) * 100) : 100;

      progressBar.style.width = `${percent}%`;

      const formattedNow = new Intl.DateTimeFormat("en-IN", {
        dateStyle: "medium",
        timeStyle: "short",
        timeZone: "Asia/Kolkata"
      }).format(now);
      todayCopy.textContent = `Current IST time: ${formattedNow}`;

      if (remaining <= 0) {
        elements.days.textContent = "0";
        elements.hours.textContent = "00";
        elements.minutes.textContent = "00";
        elements.seconds.textContent = "00";
        statusTitle.textContent = "Exam time";
        statusCopy.textContent = "The scheduled exam start time has arrived.";
        progressBar.style.width = "100%";
        return;
      }

      const seconds = Math.floor(remaining / 1000);
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      elements.days.textContent = days;
      elements.hours.textContent = pad(hours);
      elements.minutes.textContent = pad(minutes);
      elements.seconds.textContent = pad(secs);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
